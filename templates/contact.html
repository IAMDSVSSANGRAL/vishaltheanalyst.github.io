{% extends "base.html" %}
{% block content %}
<section class="section contact-section">
  <h2 class="section-title">Let’s Connect</h2>

  {% if saved == 'true' %}
    <div class="notice success">Message sent successfully 🚀</div>
  {% elif saved == 'fallback' %}
    <div class="notice warning">Saved locally. Configure DB for full storage.</div>
  {% endif %}

  <form method="POST" action="{{ url_for('contact') }}" class="contact-form" id="leadForm">

    <!-- BASIC INFO -->
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Your Full Name" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="Your Email Address" required>
      </div>
    </div>

    <!-- USER TYPE -->
    <div class="form-group">
      <label>I am a...</label>
      <select name="user_type" id="user_type" required>
        <option value="">Select One</option>
        <option value="Recruiter">Recruiter</option>
        <option value="Client">Client</option>
        <option value="Student">Student</option>
      </select>
    </div>

    <!-- RECRUITER -->
    <div class="conditional-fields recruiter-fields hidden">
      <div class="form-grid">
        <input type="text" name="company" placeholder="Company Name">
        <input type="text" name="role" placeholder="Your Role">
      </div>
      <textarea name="position" rows="2" placeholder="Hiring for which position?"></textarea>
    </div>

    <!-- CLIENT -->
    <div class="conditional-fields client-fields hidden">
      <div class="form-grid">
        <input type="text" name="company_brand" placeholder="Company / Brand Name">
        <input type="text" name="budget" placeholder="Estimated Budget">
      </div>
      <textarea name="project_desc" rows="3" placeholder="Brief project description"></textarea>
    </div>

    <!-- STUDENT -->
    <div class="conditional-fields student-fields hidden">
      <div class="form-grid">
        <input type="text" name="level" placeholder="Your Level (Beginner / Intermediate)">
      </div>
      <textarea name="learning_goal" rows="3" placeholder="What do you want to learn or discuss?"></textarea>
    </div>

    <!-- COMMON MESSAGE -->
    <textarea name="message" rows="3" placeholder="Additional Message (Optional)"></textarea>

    <button type="submit" class="btn-primary">Send Message</button>

  </form>
</section>

{% endblock %}
